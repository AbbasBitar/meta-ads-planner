name: CI - Tests and Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run automated tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Verify generated assets
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/config.js
          test -f dist/styles.css
          test -f dist/src/planner.js
